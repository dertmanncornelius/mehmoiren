<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3c8643">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}html,body{height:100%}</style>
<title>mEHmoiren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one calm column like a bound notebook — flag-green band with the Ehmen arms on top, writing desk, story index; a story opens as its own page */
/* Colors from the Ehmen flag: green over white, gold from the mill wheel in the coat of arms */
:root {
  --bg: #f3f6f2;
  --paper: #ffffff;
  --ink: #1b2a1d;
  --muted: #5a6b5c;
  --line: #d5e0d4;
  --accent: #2f7a3a;
  --accent-ink: #ffffff;
  --hover: #e8f0e7;
  --band: #3c8643;
  --band-ink: #ffffff;
  --gold: #e3b53b;
  --danger: #a33a2e;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --paper: #18211a; --ink: #e6eee6; --muted: #9fb0a0;
    --line: #2a372c; --accent: #74c482; --accent-ink: #0d1a10; --hover: #1d281f;
    --band: #2f6d37; --band-ink: #ffffff; --gold: #f0c64e; --danger: #e48a7d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --paper: #18211a; --ink: #e6eee6; --muted: #9fb0a0;
  --line: #2a372c; --accent: #74c482; --accent-ink: #0d1a10; --hover: #1d281f;
  --band: #2f6d37; --band-ink: #ffffff; --gold: #f0c64e; --danger: #e48a7d;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.6;
}
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 4rem; display: grid; gap: 2rem; }
header {
  background: var(--band); color: var(--band-ink); border-radius: 6px;
  padding: 1.1rem 1.25rem; display: flex; align-items: center; gap: 1.1rem;
  border-bottom: 4px solid var(--gold);
}
header img { width: clamp(3.6rem, 14vw, 5rem); height: auto; flex: none; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .25)); }
header .titles { display: grid; gap: .2rem; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.1rem, 8vw, 3.2rem); line-height: 1.05; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
h1 .eh { color: var(--gold); }
.sub { margin: 0; font-style: italic; opacity: .9; }

.desk { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem; display: grid; gap: .9rem; }
.desk h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; }
.row > * { flex: 1 1 12rem; min-width: 0; }
label { display: grid; gap: .3rem; font-family: var(--font-ui); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
input, textarea {
  font: inherit; font-family: var(--font-body); font-size: 1.05rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: .65rem .75rem;
  text-transform: none; letter-spacing: normal; width: 100%; box-sizing: border-box;
}
textarea { min-height: 11rem; resize: vertical; line-height: 1.65; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
button { font-family: var(--font-ui); font-size: 1rem; cursor: pointer; border-radius: 4px; padding: .65rem 1.2rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; color: var(--accent); }
button.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: .35rem .5rem; font-size: .9rem; }
button.quiet:hover { color: var(--ink); }
button.danger { background: var(--danger); border-color: var(--danger); color: var(--paper); }
button:disabled { opacity: .5; cursor: default; }
.status { font-family: var(--font-ui); font-size: .9rem; color: var(--muted); }

.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
.list-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.count { font-family: var(--font-ui); font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#search { max-width: 16rem; font-size: .95rem; padding: .45rem .65rem; }

/* Index: each story is one clickable entry */
#stories { display: grid; }
.entry { display: grid; gap: .75rem; justify-items: start; padding-block: 1.25rem; border-bottom: 1px solid var(--line); min-width: 0; }
.entry .read { padding: .5rem 1.1rem; font-size: .95rem; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.tag {
  font-family: var(--font-ui); font-size: .85rem; font-weight: 600; color: var(--ink);
  background: var(--hover); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: 3px; padding: .15rem .55rem; cursor: pointer; overflow-wrap: anywhere;
}
.tag:hover { border-color: var(--accent); border-left-color: var(--gold); }
.tag[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-left-color: var(--gold); }
.filters { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; padding-top: .9rem; }
.filters .label { font-family: var(--font-ui); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: .2rem; }
.tag .n { font-weight: 400; opacity: .75; font-variant-numeric: tabular-nums; }
.meta { font-family: var(--font-ui); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: .75rem; flex-wrap: wrap; }
.meta .when { color: var(--accent); font-weight: 600; }
.who { justify-self: start; font-family: var(--font-ui); font-size: .85rem; font-weight: 600; color: var(--ink); background: var(--hover); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 3px; padding: .15rem .55rem; overflow-wrap: anywhere; }
.entry h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }

/* Full story */
#detail { display: grid; gap: 1rem; }
#detail .back { justify-self: start; padding-inline: 0; }
#detail h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.5rem); line-height: 1.15; margin: 0; text-wrap: balance; }
#detail .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 65ch; font-size: 1.1rem; line-height: 1.75; }
.tools { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 1rem; }
.confirm { font-family: var(--font-ui); font-size: .9rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.confirm button { padding: .35rem .8rem; font-size: .9rem; }

/* Login gate */
.gate { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 3rem; box-sizing: border-box; }
.gate-card { width: 100%; max-width: 24rem; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.gate-band { background: var(--band); color: var(--band-ink); border-bottom: 4px solid var(--gold); padding: 1.5rem 1.25rem 1.25rem; display: grid; justify-items: center; gap: .6rem; text-align: center; }
.gate-band img { width: 5.5rem; height: auto; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .25)); }
.gate-band h1 { font-size: clamp(2rem, 9vw, 2.6rem); }
.gate form { padding: 1.25rem; display: grid; gap: .9rem; }
.gate button[type="submit"] { width: 100%; }
.gate-error { font-family: var(--font-ui); font-size: .9rem; color: var(--danger); margin: 0; }

.empty { padding-block: 2.5rem; color: var(--muted); }
.empty strong { color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; display: block; margin-bottom: .25rem; }

.foot { display: flex; justify-content: center; border-top: 1px solid var(--line); padding-top: 1rem; }
.loading { color: var(--muted); font-family: var(--font-ui); font-size: .95rem; padding-block: 1.5rem; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-band">
      <img id="gate-arms" alt="Wappen von Ehmen" width="240" height="282">
      <h1>m<span class="eh">EH</span>moiren</h1>
    </div>
    <form id="login" autocomplete="on">
      <label for="login-user">Anmeldename
        <input id="login-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label for="login-pass">Passwort
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="gate-error" id="login-error" role="alert" hidden></p>
      <button type="submit">Anmelden</button>
    </form>
  </div>
</div>

  <div id="home" class="wrap" style="padding:0">
    <form class="desk" id="form" autocomplete="off" hidden>
      <h2 id="form-title">Neue Geschichte</h2>
      <div class="row">
        <label for="title">Titel
          <input id="title" name="title" maxlength="140" placeholder="z. B. Der Sommer am Bodensee">
        </label>
        <label for="when">Wann war das?
          <input id="when" name="when" maxlength="60" placeholder="z. B. 1987 oder Kindheit">
        </label>
      </div>
      <label for="who">Wer ist dabei?
        <input id="who" name="who" maxlength="120" placeholder="z. B. Dustin, Manni">
      </label>
      <label for="text">Geschichte
        <textarea id="text" name="text" placeholder="Erzähl einfach drauflos …"></textarea>
      </label>
      <div class="actions">
        <button type="submit" id="save">Geschichte speichern</button>
        <button type="button" class="ghost" id="cancel" hidden>Abbrechen</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </form>

    <section>
      <div class="list-head">
        <h2>Geschichten <span class="count" id="count"></span></h2>
        <input id="search" type="search" placeholder="Suchen …" aria-label="Geschichten durchsuchen">
      </div>
      <div class="filters" id="filters" hidden></div>
      <div id="stories">
        <div class="empty" id="empty">
          <strong>Noch keine Geschichten</strong>
          <span id="empty-hint">Schreib oben deine erste Erinnerung auf und tippe auf „Geschichte speichern“. Sie erscheint dann hier.</span>
        </div>
      </div>
    </section>
  </div>

  <article id="detail" hidden>
    <button type="button" class="quiet back" id="back">← Alle Geschichten</button>
    <div class="meta" id="d-meta"></div>
    <h2 id="d-title"></h2>
    <span class="who" id="d-who" hidden></span>
    <p class="body" id="d-body"></p>
    <div class="tools" id="d-tools"></div>
  </article>

  <footer class="foot">
    <button type="button" class="quiet" id="logout">Abmelden</button>
  </footer>
</div>
